name: Reproduce numerical BB study
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'report_template.py'
      - 'study_config.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: numerical-bb-main
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify and execute sequential study
        env:
          MPLBACKEND: Agg
          NUMBA_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m src.study
          python -m unittest discover -s tests -v
      - name: Commit generated evidence to the same private repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data results report
          if ! git diff --cached --quiet; then
            git commit -m 'data: reproduce numerical results and HTML report [skip ci]' -m 'AI-Model: GPT-6 Astra Pro'
            git push origin HEAD:main
          fi
      - name: Preserve evidence if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-bb-evidence
          path: |
            results
            data
            report
          retention-days: 14
