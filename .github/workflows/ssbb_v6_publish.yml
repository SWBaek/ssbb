name: Recompute and publish V6 - 230Vac 48Arms Peak dq 16us
on:
  push:
    branches: [main]
    paths:
      - 'studies/v6/bootstrap/**'
      - '.github/workflows/ssbb_v6_publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ssbb-v6-publication
  cancel-in-progress: false
jobs:
  recompute-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V6_WORK: ${{ runner.temp }}/ssbb_v6
      V6_DELIVERY_DIR: ${{ runner.temp }}/v6_delivery
      V6_TAG: ssbb-v6-20260928-230v48a-16us
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source payload and restore into empty working directory
        run: python studies/v6/bootstrap/restore.py "$V6_WORK"
      - name: Install pinned numerical and document dependencies
        run: |
          python -m pip install -r "$V6_WORK/requirements.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress fonts-nanum
      - name: Recompute every V6 run, audit all raw data, and build report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python "$V6_WORK/src/remote_build.py"
      - name: Commit V6 report and result tables without modifying older versions
        run: |
          rsync -a --exclude='waveforms/' --exclude='__pycache__/' --exclude='renders/' --exclude='*.pid' "$V6_WORK/" studies/v6/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- studies/v6/
          if ! git diff --cached --quiet; then
            git commit -m 'docs(ssbb): publish freshly recomputed V6 report and all result tables [skip ci]' -m '230Vac / 48Arms / Peak dq / PWM and control 62500Hz. Computed nominal capacity 11.04kVA; requested class label 11.52kVA.' -m 'AI-Model: GPT-6 Astra Pro'
            git push origin HEAD:main
          fi
      - name: Publish permanent private release with all raw waveform archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/v6-release-notes.md" <<'EOF'
          V6: fresh numerical study and editable BB report.
          Confirmed inputs: 230 Vac, 48 Arms, peak-valued dq commands, PWM=control=62.5 kHz (16 us).
          Requested product class: 11.52 kVA. Arithmetic at the specified operating point: 230 x 48 = 11.04 kVA. No silent replacement with 240 Vac.
          Includes all 502 raw waveform runs, source, result tables, audit logs, PPTX and PDF.
          Numerical reference study only; not hardware validation, certification or an approved production control calibration.
          EOF
          if gh release view "$V6_TAG" >/dev/null 2>&1; then
            gh release upload "$V6_TAG" "$V6_DELIVERY_DIR"/*.zip "$V6_DELIVERY_DIR"/*.pptx "$V6_DELIVERY_DIR"/*.pdf "$V6_DELIVERY_DIR"/*.json --clobber
          else
            gh release create "$V6_TAG" "$V6_DELIVERY_DIR"/*.zip "$V6_DELIVERY_DIR"/*.pptx "$V6_DELIVERY_DIR"/*.pdf "$V6_DELIVERY_DIR"/*.json --target "$(git rev-parse HEAD)" --title 'V6 - 230Vac 48Arms Peak dq, 62.5kHz control and PWM' --notes-file "$RUNNER_TEMP/v6-release-notes.md"
          fi
          gh release view "$V6_TAG" --json url,assets > "$V6_DELIVERY_DIR/release_verification.json"
      - name: Preserve publication evidence and compact report delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssbb-v6-report-verification
          path: |
            ${{ runner.temp }}/v6_delivery/SSBB_V6_Study_and_Report.zip
            ${{ runner.temp }}/v6_delivery/*.pptx
            ${{ runner.temp }}/v6_delivery/*.pdf
            ${{ runner.temp }}/v6_delivery/*.json
            ${{ runner.temp }}/ssbb_v6/qa/*.log
            ${{ runner.temp }}/ssbb_v6/qa/*.json
          if-no-files-found: warn
          retention-days: 30
